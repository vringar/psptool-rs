[package]
name = "psptool-ops"
description = "High-level PSP firmware operations: list, extract, replace, sign, verify, search-keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]

[features]
# Opt the corpus_replace integration test into iterating
# `vendor/test-corpus/test_files/`. Mirrors the `corpus` flag on
# `psptool-core`; the test self-skips when `PSPTOOL_TEST_CORPUS` is unset.
default = ["corpus"]
corpus = ["psptool-fixtures/corpus"]

[dependencies]
psptool-core.workspace = true
md-5 = "0.10"
serde_json = "1"
thiserror = "2"
# Crypto stack for sign + verify (issue #13). `verify` reuses the
# `HeaderEntry::verify_signature` path already in psptool-core; `sign`
# generates fresh PSS signatures with caller-provided private keys.
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"

[dev-dependencies]
psptool-fixtures = { workspace = true }
insta = { version = "1", features = ["json"] }
aes = "0.8"
cbc = "0.1"
libtest-mimic = "0.8"

# Custom harness so corpus_replace can register one named test per ROM file
# at runtime via libtest_mimic. Mirrors the `corpus_roundtrip` test in
# `psptool-core`.
[[test]]
name = "corpus_replace"
harness = false
