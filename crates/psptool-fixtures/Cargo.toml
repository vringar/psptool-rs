[package]
name = "psptool-fixtures"
description = "Test corpus loader and micro-fixtures shared across psptool-rs crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]

[features]
# When `corpus` is enabled, downstream tests opt into the corpus-using paths.
# The actual `PSPTOOL_TEST_CORPUS` environment variable still gates whether
# any files are present at runtime; with the feature off, only micro-fixtures
# are exercised.
default = []
corpus = []

[dev-dependencies]
# Used only by `examples/build_fixtures.rs` to produce the committed
# `data/header_compressed.bin` zlib stream. Not a runtime dependency.
flate2 = "1.0"
