# translate-routes.toml — read-gate route table
#
# Consumed by tooling/translate-discipline.py to gate Edit/Write on target
# source files. Each [[route]] declares:
#
#   crate_pattern : repo-relative path or glob (supports * and **) matched
#                   against the target file (includes the crates/ prefix).
#   upstream      : list of upstream paths at least ONE of which must be
#                   Read before the edit. Upstream = the reference Python
#                   PSPTool, shallow-cloned to /tmp/psptool-ref
#                   (git clone --depth 1 https://github.com/PSPReverse/PSPTool /tmp/psptool-ref).
#   design        : path to the .design/<area>/<doc>.md governing this
#                   translation. MUST exist on disk; if missing, the hook
#                   blocks with acto-doc-author dispatch instructions.
#   parity_ops    : which parity suites gate this file. Valid values:
#                     "roundtrip"    -> cargo test -p psptool-core --test corpus_roundtrip
#                     "differential" -> cargo test -p psptool-cli  --test differential
#                   Empty list = crate test suite is the only gate (helper file).
#
# Additionally, every gated edit requires Read of goal.md in the same
# session (the global discipline file).
#
# Files under crates/psptool-*/src/** without a matching route are BLOCKED
# until a route is added (strict-mode default, goal.md R-XLATE-2). This is
# the point: sourcing each translation unit is a deliberate decision.
# psptool-fixtures is excluded from gating (test scaffolding, no upstream).
#
# The table grows one route per translation unit as the 8-step loop reaches
# it, leaf crates first (psptool-core -> psptool-ops -> psptool-cli). The
# seed routes below cover the leaf-most core units; their design docs do not
# exist yet, so the first edit to each will (correctly) require an
# acto-doc-author dispatch.
# ─────────────────────────────────────────────────────────────────────────

# --- psptool-core (leaf) -------------------------------------------------

[[route]]
crate_pattern = "crates/psptool-core/src/fletcher.rs"
upstream = [
  "/tmp/psptool-ref/psptool/utils.py",
]
design = ".design/psptool-core/fletcher.md"
parity_ops = ["roundtrip"]

[[route]]
crate_pattern = "crates/psptool-core/src/entry.rs"
upstream = [
  "/tmp/psptool-ref/psptool/entry.py",
  "/tmp/psptool-ref/psptool/file.py",
]
design = ".design/psptool-core/entry.md"
parity_ops = ["roundtrip", "differential"]

[[route]]
crate_pattern = "crates/psptool-core/src/directory.rs"
upstream = [
  "/tmp/psptool-ref/psptool/directory.py",
]
design = ".design/psptool-core/directory.md"
parity_ops = ["roundtrip", "differential"]

[[route]]
crate_pattern = "crates/psptool-core/src/fet.rs"
upstream = [
  "/tmp/psptool-ref/psptool/fet.py",
  "/tmp/psptool-ref/psptool/blob.py",
  "/tmp/psptool-ref/psptool/rom.py",
]
design = ".design/psptool-core/fet.md"
parity_ops = ["roundtrip", "differential"]

[[route]]
crate_pattern = "crates/psptool-core/src/address.rs"
upstream = [
  "/tmp/psptool-ref/psptool/entry.py",
  "/tmp/psptool-ref/psptool/directory.py",
]
design = ".design/psptool-core/address.md"
parity_ops = ["roundtrip"]

[[route]]
crate_pattern = "crates/psptool-core/src/writer.rs"
upstream = [
  "/tmp/psptool-ref/psptool/utils.py",
  "/tmp/psptool-ref/psptool/blob.py",
]
design = ".design/psptool-core/writer.md"
parity_ops = ["roundtrip"]

# --- psptool-cli (top layer; consumes psptool-ops) -----------------------

[[route]]
crate_pattern = "crates/psptool-cli/src/cli.rs"
upstream = ["/tmp/psptool-ref/psptool/__main__.py"]
design = ".design/psptool-ops/list.md"
parity_ops = []

[[route]]
crate_pattern = "crates/psptool-cli/src/cmds/list.rs"
upstream = ["/tmp/psptool-ref/psptool/psptool.py"]
design = ".design/psptool-ops/list.md"
parity_ops = ["differential"]

[[route]]
crate_pattern = "crates/psptool-cli/src/main.rs"
upstream = ["/tmp/psptool-ref/psptool/__main__.py"]
design = ".design/psptool-ops/list.md"
parity_ops = []

[[route]]
crate_pattern = "crates/psptool-cli/src/cmds/extract.rs"
upstream = [
  "/tmp/psptool-ref/psptool/__main__.py",
]
design = ".design/psptool-ops/extract.md"
# The CLI extract subcommand — mirrors the reference __main__.py -X path
# (single-file -u/-c preconditions + envelope accessors, multi-file bare-body
# -c). Not exercised by roundtrip or the ls differential; its oracle is the
# psptool-ops extract suite + the envelope pins.
parity_ops = []

[[route]]
crate_pattern = "crates/psptool-cli/src/cmds/sign.rs"
upstream = [
  "/tmp/psptool-ref/psptool/__main__.py",
  "/tmp/psptool-ref/psptool/cert_tree.py",
  "/tmp/psptool-ref/psptool/header_file.py",
]
design = ".design/psptool-ops/sign.md"
# The CLI sign subcommand — loads the key and drives psptool_ops::sign_entry
# (upstream's resign flow, __main__.py:238-262 -> cert_tree.py:101-117). Not
# exercised by roundtrip or the ls differential; its oracle is the psptool-ops
# sign suite + the live-reference psptool-cli/tests/sign_oracle.rs.
parity_ops = []

[[route]]
crate_pattern = "crates/psptool-cli/src/cmds/replace.rs"
upstream = [
  "/tmp/psptool-ref/psptool/__main__.py",
  "/tmp/psptool-ref/psptool/cert_tree.py",
  "/tmp/psptool-ref/psptool/header_file.py",
]
design = ".design/psptool-ops/replace.md"
# The CLI replace subcommand / -R fast path (__main__.py:238-262): replace the
# body, then optionally re-sign through psptool_ops::sign_entry. Its oracle is
# the psptool-ops replace + sign suites and sign_oracle.rs.
parity_ops = []

# --- psptool-ops (depends on psptool-core; leaf-first order satisfied) ----

[[route]]
crate_pattern = "crates/psptool-ops/src/replace.rs"
upstream = [
  "/tmp/psptool-ref/psptool/directory.py",
  "/tmp/psptool-ref/psptool/entry.py",
  "/tmp/psptool-ref/psptool/file.py",
  "/tmp/psptool-ref/psptool/__main__.py",
]
design = ".design/psptool-ops/replace.md"
# replace.rs's own oracle is the psptool-ops crate suite (corpus_replace +
# divergence_fletcher) — neither the core roundtrip nor the list-only
# differential exercises the mutation path — so the crate test suite gates it.
parity_ops = []

[[route]]
crate_pattern = "crates/psptool-ops/src/list.rs"
upstream = [
  "/tmp/psptool-ref/psptool/psptool.py",
  "/tmp/psptool-ref/psptool/directory.py",
  "/tmp/psptool-ref/psptool/entry.py",
]
design = ".design/psptool-ops/list.md"
# list.rs renders the ls/ls_json output the differential test parses, so the
# differential suite is its oracle.
parity_ops = ["differential"]

[[route]]
crate_pattern = "crates/psptool-ops/src/table.rs"
upstream = ["/tmp/psptool-ref/psptool/psptool.py"]
design = ".design/psptool-ops/list.md"
# The PrettyTable look-alike list.rs renders the ls tables with
# (psptool.py:68/79/106). Text only — the differential reads the JSON — so the
# crate suite (table::tests, list_micro + psptool-cli synthetic snapshots) is
# its oracle.
parity_ops = []

[[route]]
crate_pattern = "crates/psptool-ops/src/sign.rs"
upstream = [
  "/tmp/psptool-ref/psptool/crypto.py",
  "/tmp/psptool-ref/psptool/file.py",
  "/tmp/psptool-ref/psptool/header_file.py",
  "/tmp/psptool-ref/psptool/cert_tree.py",
]
design = ".design/psptool-ops/sign.md"
# RSA re-signing is not exercised by roundtrip (no mutation) or the ls
# differential (read-only); the psptool-ops crate suite (sign→verify roundtrip
# + sign locality/reject pins) is its oracle.
parity_ops = []

[[route]]
crate_pattern = "crates/psptool-core/src/body.rs"
upstream = [
  "/tmp/psptool-ref/psptool/header_file.py",
  "/tmp/psptool-ref/psptool/file.py",
  "/tmp/psptool-ref/psptool/crypto.py",
  "/tmp/psptool-ref/psptool/utils.py",
  "/tmp/psptool-ref/psptool/cert_tree.py",
]
design = ".design/psptool-core/body.md"
# Entry-body ops (get_bytes/decompress/decrypt/verify/signed-region) aren't
# exercised by roundtrip or the ls differential; the oracle is the crate-side
# verify-against-real-corpus test (divergence_signature_byte_order.rs) — the
# oracle that was missing and exposed #78/#79.
parity_ops = []

[[route]]
crate_pattern = "crates/psptool-ops/src/extract.rs"
upstream = [
  "/tmp/psptool-ref/psptool/__main__.py",
  "/tmp/psptool-ref/psptool/file.py",
  "/tmp/psptool-ref/psptool/header_file.py",
]
design = ".design/psptool-ops/extract.md"
# extract_raw/decompressed/decrypted delegate to the (already-audited) core
# body.rs ops; the extract path is not exercised by roundtrip (no mutation) or
# the ls differential (read-only), so the psptool-ops crate suite (extract::tests)
# is its oracle, like sign.rs.
parity_ops = []

[[route]]
crate_pattern = "crates/psptool-ops/src/verify.rs"
upstream = [
  "/tmp/psptool-ref/psptool/cert_tree.py",
  "/tmp/psptool-ref/psptool/key_store_file.py",
  "/tmp/psptool-ref/psptool/header_file.py",
]
design = ".design/psptool-core/body.md"
# The chain-of-trust report: SignedEntity.is_verified() over the blob's
# CertificateTree, i.e. the signature rung of the core decode-verification
# ladder (body.md REQ-6). Not exercised by roundtrip or the ls differential;
# its oracles are the psptool-ops suite (decode_verification.rs `verify_*`)
# and psptool-cli/tests/verify_oracle.rs (live reference, every corpus ROM).
parity_ops = []

[[route]]
crate_pattern = "crates/psptool-cli/src/cmds/verify.rs"
upstream = ["/tmp/psptool-ref/psptool/cert_tree.py"]
design = ".design/psptool-core/body.md"
# The Rust-native `verify` subcommand over psptool-ops verify.rs; same oracles.
parity_ops = []

# --- psptool-py (Python bindings; consumes psptool-core + psptool-ops) ----

[[route]]
crate_pattern = "crates/psptool-py/src/*.rs"
upstream = [
  "/tmp/psptool-ref/psptool/psptool.py",
  "/tmp/psptool-ref/psptool/blob.py",
  "/tmp/psptool-ref/psptool/rom.py",
  "/tmp/psptool-ref/psptool/fet.py",
  "/tmp/psptool-ref/psptool/directory.py",
  "/tmp/psptool-ref/psptool/entry.py",
  "/tmp/psptool-ref/psptool/file.py",
  "/tmp/psptool-ref/psptool/header_file.py",
  "/tmp/psptool-ref/psptool/pubkey_file.py",
  "/tmp/psptool-ref/psptool/key_store_file.py",
  "/tmp/psptool-ref/psptool/microcode_file.py",
  "/tmp/psptool-ref/psptool/cert_tree.py",
  "/tmp/psptool-ref/psptool/crypto.py",
  "/tmp/psptool-ref/psptool/utils.py",
]
design = ".design/psptool-py/bindings.md"
# The bindings mirror upstream's Python object model; their oracle is the
# crate's own `corpus_parity` suite (bindings vs the reference interpreter on
# the corpus) plus the crate tests, not the core roundtrip or the ls
# differential.
parity_ops = []
